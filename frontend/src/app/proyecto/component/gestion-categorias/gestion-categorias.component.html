<app-posicion-global></app-posicion-global>

<div class="contenido">
    <!--categorias-->
    <h3>Categorías</h3>
    <div class="cat">
        <div *ngFor="let categoria of categorias">
            <a href="#" (click)="seleccionarCategoria(categoria.nombre, $event)">

                <span class="material-symbols-outlined">{{ categoria.icono }}</span>
                {{ categoria.nombre }}
            </a>
        </div>
    </div>

    <!--presupuesto-->
    <div class="presupuesto" *ngIf="categoriaSeleccionada">
        <label>Presupuesto para la categoría seleccionada: {{ categoriaSeleccionada }}</label>
        <div>
            <input type="number" [(ngModel)]="presupuesto" />
            <span>€</span>
        </div>

        <!--frecuencia-->
        <div>
            <label>Frecuencia:</label>
            <span>Mensual</span><!--siempre mensual-->
        </div>

        <p>
            Si quiere modificar el presupuesto, ingrese la cantidad correspondiente y guarde los cambios.
        </p>

        <button (click)="modificarCampos()">Modificar campos</button>
        <button (click)="guardarPresupuesto()">Guardar</button>
    </div>
</div>
